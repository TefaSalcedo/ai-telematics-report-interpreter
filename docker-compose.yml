services:
  # ---- Backend: Python + FastAPI ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-telematics-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Frontend: React ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-telematics-frontend
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    restart: unless-stopped
